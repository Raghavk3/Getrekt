<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Bouquet for You</title>
  <link rel="stylesheet" href="main.css">
</head>
<body class="bouquet-page">
  <div class="leaf leaf-a"><img src="leaves1.png" alt=""></div>
  <div class="leaf leaf-d"><img src="leaves4.png" alt=""></div>

  <main class="bouquet-card">
    <div class="bouquet" aria-label="A 3D bouquet of roses">
      <div class="rose r1"><span></span></div>
      <div class="rose r2"><span></span></div>
      <div class="rose r3"><span></span></div>
      <div class="rose r4"><span></span></div>
      <div class="rose r5"><span></span></div>
      <div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div>
      <div class="stem s4"></div><div class="stem s5"></div>
      <div class="leaf-shape l1"></div><div class="leaf-shape l2"></div>
      <div class="leaf-shape l3"></div><div class="leaf-shape l4"></div>
      <div class="ribbon"></div>
    </div>
    <h1>Our plans are set ♡</h1>
    <p id="summary"></p>
    <p class="bouquet-note">A little bouquet for you.</p>
  </main>

  <script src="main.js"></script>
</body>
</html>
