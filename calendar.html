<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick a Date</title>
  <link rel="stylesheet" href="main.css">
</head>
<body class="sub-page">
  <div class="leaf leaf-a"><img src="leaves1.png" alt=""></div>
  <div class="leaf leaf-d"><img src="leaves4.png" alt=""></div>

  <main class="wrapper calendar-wrapper">
    <div class="small-icon">♡</div>
    <h2>October 2026</h2>
    <p class="subtitle">Pick one or more dates</p>

    <div class="calendar" aria-label="October 2026 calendar">
      <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div>
      <div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div>
      <div class="blank"></div><div class="blank"></div><div class="blank"></div>
      <button class="date" data-date="2026-10-01">1</button>
      <button class="date" data-date="2026-10-02">2</button>
      <button class="date" data-date="2026-10-03">3</button>
      <button class="date" data-date="2026-10-04">4</button>
      <button class="date" data-date="2026-10-05">5</button>
      <button class="date" data-date="2026-10-06">6</button>
      <button class="date" data-date="2026-10-07">7</button>
      <button class="date" data-date="2026-10-08">8</button>
      <button class="date" data-date="2026-10-09">9</button>
      <button class="date" data-date="2026-10-10">10</button>
      <button class="date" data-date="2026-10-11">11</button>
      <button class="date" data-date="2026-10-12">12</button>
      <button class="date" data-date="2026-10-13">13</button>
      <button class="date" data-date="2026-10-14">14</button>
      <button class="date" data-date="2026-10-15">15</button>
      <button class="date" data-date="2026-10-16">16</button>
      <button class="date" data-date="2026-10-17">17</button>
      <button class="date" data-date="2026-10-18">18</button>
      <button class="date" data-date="2026-10-19">19</button>
      <button class="date" data-date="2026-10-20">20</button>
      <button class="date" data-date="2026-10-21">21</button>
      <button class="date" data-date="2026-10-22">22</button>
      <button class="date" data-date="2026-10-23">23</button>
      <button class="date" data-date="2026-10-24">24</button>
      <button class="date" data-date="2026-10-25">25</button>
      <button class="date" data-date="2026-10-26">26</button>
      <button class="date" data-date="2026-10-27">27</button>
      <button class="date" data-date="2026-10-28">28</button>
      <button class="date" data-date="2026-10-29">29</button>
      <button class="date" data-date="2026-10-30">30</button>
      <button class="date" data-date="2026-10-31">31</button>
    </div>

    <p id="selectedDates" class="selected-dates">No dates selected</p>
    <button id="calendarProceed" class="proceed" type="button">Proceed</button>
  </main>

  <script src="main.js"></script>
</body>
</html>
